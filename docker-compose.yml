services:
  discovery-server:
    build: .
    container_name: discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - convivo-network
    environment:
      SERVER_PORT: 8761
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      SPRING_PROFILES_ACTIVE: prod
      # Sin defaults: si falta la variable, compose aborta en vez de arrancar con credencial vacía
      SPRING_SECURITY_USER_NAME: ${EUREKA_USERNAME:?EUREKA_USERNAME requerido en .env}
      SPRING_SECURITY_USER_PASSWORD: ${EUREKA_PASSWORD:?EUREKA_PASSWORD requerido en .env}
      SSL_KEYSTORE_PATH: file:/run/secrets/keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:?SSL_KEYSTORE_PASSWORD requerido en .env}
    volumes:
      # Keystore fuera del repo y de la imagen; ver .env.example
      - ./certs/keystore.p12:/run/secrets/keystore.p12:ro

  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: convivo-discovery-scanner
    profiles:
      - tools
    env_file:
      - path: .env
        required: false
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN=${SONAR_TOKEN:-}
    volumes:
      - ./:/usr/src
    networks:
      - convivo-network

networks:
  convivo-network:
    external: true
    name: convivo-network
