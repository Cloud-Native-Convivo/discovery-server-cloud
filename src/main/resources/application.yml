server:
  port: 8761
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12

spring:
  application:
    name: discovery-server
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://localhost:8888"

# Standalone: no registrarse ni buscar registro contra sí mismo. Sin esto el
# cliente Eureka embebido (via @EnableEurekaServer) reintenta conectar a
# localhost:8761 en loop ("Cannot execute request on any known server"),
# lo que además tumba /actuator/health y el healthCheck de ECS.
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
